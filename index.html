<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CEIS 273 – A-Frame Practical Quiz 2</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(15, 10, 5, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,200,100,0.25);
      color: #F5DEB3;
      font-family: 'Georgia', serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 10px 24px;
      border-radius: 30px;
      z-index: 999;
      pointer-events: none;
    }
    #hud span { opacity: 0.6; }
    #hud strong { color: #FFD27F; }
  </style>
</head>
<body>

  <div id="hud">
    <strong>W A S D</strong><span>move</span>
    &nbsp;·&nbsp;
    <strong>Mouse</strong><span>look</span>
    &nbsp;·&nbsp;
    <span>CEIS 273 · A-Frame Assessment</span>
  </div>

  <a-scene shadow="type: pcfsoft" renderer="antialias: true; colorManagement: true;">

    <!-- CAMERA -->

    <a-light type="point" position="0 2.7 -1.2" color="#FFD27F" intensity="1.4"
             distance="6" decay="2" cast-shadow="true"></a-light>
    <a-light type="directional" position="3 4 1" color="#FFF5E0" intensity="0.5" cast-shadow="true"></a-light>
    <a-light type="point" position="-3.5 2 -3.5" color="#C5E8FF" intensity="0.35" distance="5" decay="2"></a-light>
    <a-light type="point" position="3.4 1.9 -3.8" color="#FFD060" intensity="0.6" distance="3" decay="2"></a-light>

    <!-- FLOOR -->

             color="#3E2A1A" material="roughness:0.9; metalness:0.0"
             shadow="receive:true"></a-plane>

    <a-box position="0 0.002 -2.06" width="9" height="0.003" depth="0.28" color="#4A3020" opacity="0.35"></a-box>
    <a-box position="0 0.002 -2.34" width="9" height="0.003" depth="0.28" color="#2C1A0E" opacity="0.3"></a-box>
    <a-box position="0 0.002 -2.62" width="9" height="0.003" depth="0.28" color="#4A3020" opacity="0.35"></a-box>
    <a-box position="0 0.002 -1.22" width="9" height="0.003" depth="0.28" color="#2C1A0E" opacity="0.3"></a-box>
    <a-box position="0 0.002 -0.94" width="9" height="0.003" depth="0.28" color="#4A3020" opacity="0.35"></a-box>
    <a-box position="0 0.002 -0.66" width="9" height="0.003" depth="0.28" color="#2C1A0E" opacity="0.3"></a-box>

    <a-box position="0 0.82 -1.2" width="0.5" height="0.005" depth="0.95" color="#C8A870" opacity="0.85"></a-box>

    <!--
      ═══════════════════════════════════════════════════
      CHAIR 1 — FRONT of table (z = +0.12)
      Faces the table → backrest is on the FAR side from table
      Table is at z=-1.2, chair is at z=+0.12
      "Away from table" = more positive z
      So backrest panel is at z = seat_z + half_depth = 0.12 + 0.30 = +0.42
      ═══════════════════════════════════════════════════
    -->
